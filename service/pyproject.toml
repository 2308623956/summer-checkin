# Python 依赖不在这里：装什么看 requirements.txt / requirements-dev.txt
# （普通 venv + pip，`-i` 可直接指定镜像源）。
# 本文件只留项目元信息与 ruff / pytest 的工具配置。
[project]
name = "summer-checkin-service"
version = "0.1.0"
description = "Summer Checkin 领域服务（FastAPI）：业务数据与 agent 的唯一所有者"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 本项目注释与文档字符串用中文，全角标点是有意为之，不是笔误。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 项目不再作为包装进 venv（pip 只装依赖），所以要让 pytest 把 service/ 自己
# 加进 sys.path，否则 `import app.*` 找不到——uvicorn 与 alembic 各自有等价的机制。
pythonpath = ["."]
